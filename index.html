<!DOCTYPE html>
<html>
<head>
    <title>Display Date</title>

    <script>
        function displayDate() {
            var today = new Date();

            alert("Button clicked! Displaying today's date.");

            document.getElementById("dateBox").value = today.toDateString();
        }
    </script>
</head>

<body>
    <h2>Display Date</h2>

    <input type="text" id="dateBox" placeholder="Date will appear here" readonly>

    <br><br>
    <button onclick="displayDate()">Display Date</button>
</body>
</html>
